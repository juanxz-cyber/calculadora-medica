<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Calculadora Antropométrica Pro</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IMC Clínico">
  <meta name="theme-color" content="#0b0f19">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px; }
    .container { width: 100%; max-width: 540px; margin: auto; }
    .card { background: #111827; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 22px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 19px; font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
    .tag { font-size: 10px; padding: 3px 7px; border-radius: 6px; background: rgba(34, 197, 94, 0.15); color: #4ade80; font-weight: 700; text-transform: uppercase; border: 1px solid rgba(34, 197, 94, 0.3); }

    .toggle-group { display: flex; background: #1e293b; padding: 3px; border-radius: 12px; }
    .toggle-btn { padding: 6px 12px; border: none; background: transparent; color: #94a3b8; font-size: 12px; font-weight: 600; border-radius: 9px; cursor: pointer; transition: 0.2s; }
    .toggle-btn.active { background: #0284c7; color: #ffffff; }

    .sex-selector { display: flex; gap: 8px; margin-bottom: 16px; }
    .sex-btn { flex: 1; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: #1e293b; color: #cbd5e1; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
    .sex-btn.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); color: #38bdf8; }

    .input-box { background: #1a2234; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 15px; margin-bottom: 12px; }
    .input-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .input-title { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .input-badge { display: flex; align-items: center; background: #0b0f19; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 4px 10px; font-weight: 700; color: #38bdf8; font-size: 15px; }
    .num-input { width: 55px; background: transparent; border: none; color: #38bdf8; font-weight: 700; font-size: 15px; text-align: right; outline: none; }

    input[type=range] { width: 100%; height: 8px; border-radius: 6px; background: #334155; outline: none; -webkit-appearance: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #38bdf8; border: 3px solid #0b0f19; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }

    .results-card { background: #172033; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 18px; text-align: center; margin-top: 10px; }
    .imc-title { font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; }
    .imc-val { font-size: 48px; font-weight: 800; color: #f8fafc; line-height: 1.1; margin-top: 4px; }
    .imc-class { font-size: 16px; font-weight: 700; margin-bottom: 12px; }

    .meter-container { width: 100%; margin: 10px 0 14px 0; position: relative; }
    .meter-bar { height: 10px; border-radius: 6px; width: 100%; background: linear-gradient(to right, #38bdf8 0%, #22c55e 25%, #eab308 55%, #f97316 75%, #ef4444 100%); }
    .meter-indicator { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid #ffffff; position: absolute; top: -11px; left: 50%; transform: translateX(-50%); transition: left 0.2s ease-out; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .metric-cell { background: #111827; border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; text-align: left; }
    .metric-cell.highlight { border-color: rgba(56, 189, 248, 0.3); background: rgba(56, 189, 248, 0.05); }
    .metric-cell-title { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .metric-cell-val { font-size: 14px; font-weight: 700; color: #e2e8f0; }

    .btn-copy { width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg, #0284c7, #0369a1); color: #ffffff; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3); transition: 0.2s; }
    .btn-copy:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header">
        <h1>IMC + Metabolismo <span class="tag">LIVE v2.0</span></h1>
        <div class="toggle-group">
          <button id="btnSI" class="toggle-btn active" onclick="setSystem('si')">Métrico</button>
          <button id="btnImp" class="toggle-btn" onclick="setSystem('imp')">Imperial</button>
        </div>
      </div>

      <div class="sex-selector">
        <button id="btnM" class="sex-btn active" onclick="setSex('m')">♂ Masculino</button>
        <button id="btnF" class="sex-btn" onclick="setSex('f')">♀ Femenino</button>
      </div>

      <!-- Edad (NUEVO) -->
      <div class="input-box">
        <div class="input-header">
          <span class="input-title">Edad del Paciente</span>
          <div class="input-badge">
            <input type="number" id="edadInput" class="num-input" value="20">
            <span style="font-size: 12px; color: #94a3b8; margin-left: 4px;">años</span>
          </div>
        </div>
        <input type="range" id="edadSlider" min="15" max="90" value="20">
      </div>

      <!-- Peso -->
      <div class="input-box">
        <div class="input-header">
          <span class="input-title">Peso Corporal</span>
          <div class="input-badge">
            <input type="number" id="pesoInput" class="num-input" value="75">
            <span id="pesoUnit" style="font-size: 12px; color: #94a3b8; margin-left: 4px;">kg</span>
          </div>
        </div>
        <input type="range" id="pesoSlider" min="30" max="220" value="75">
      </div>

      <!-- Estatura Métrico -->
      <div id="metricBox" class="input-box">
        <div class="input-header">
          <span class="input-title">Estatura</span>
          <div class="input-badge">
            <input type="number" id="tallaInput" class="num-input" value="175">
            <span style="font-size: 12px; color: #94a3b8; margin-left: 4px;">cm</span>
          </div>
        </div>
        <input type="range" id="tallaSlider" min="100" max="220" value="175">
      </div>

      <!-- Estatura Imperial -->
      <div id="imperialBox" class="input-box" style="display: none;">
        <div class="input-header">
          <span class="input-title">Estatura</span>
          <div class="input-badge"><span id="ftInDisplay">5' 9"</span></div>
        </div>
        <div style="display: flex; gap: 14px; margin-top: 6px;">
          <div style="flex: 1;">
            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Pies (ft): <b id="ftVal" style="color:#38bdf8">5</b></div>
            <input type="range" id="ftSlider" min="3" max="7" value="5">
          </div>
          <div style="flex: 1;">
            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Pulgadas (in): <b id="inVal" style="color:#38bdf8">9</b></div>
            <input type="range" id="inSlider" min="0" max="11" value="9">
          </div>
        </div>
      </div>

      <!-- Resultados -->
      <div class="results-card">
        <div class="imc-title">Índice de Masa Corporal</div>
        <div class="imc-val" id="imcDisplay">24.5</div>
        <div class="imc-class" id="classDisplay" style="color: #22c55e;">Normopeso</div>

        <div class="meter-container">
          <div class="meter-bar"></div>
          <div class="meter-indicator" id="indicator"></div>
        </div>

        <div class="metrics-grid">
          <div class="metric-cell highlight">
            <div class="metric-cell-title">Gasto Basal (Mifflin)</div>
            <div class="metric-cell-val" id="tmbDisplay" style="color:#38bdf8;">1749 kcal/día</div>
          </div>
          <div class="metric-cell">
            <div class="metric-cell-title">Sup. Corporal (Mosteller)</div>
            <div class="metric-cell-val" id="bsaDisplay">1.90 m²</div>
          </div>
          <div class="metric-cell">
            <div class="metric-cell-title">Peso Ideal (Devine)</div>
            <div class="metric-cell-val" id="devineDisplay">70.5 kg</div>
          </div>
          <div class="metric-cell">
            <div class="metric-cell-title">Estado de Peso</div>
            <div class="metric-cell-val" id="deltaDisplay" style="color: #4ade80;">Óptimo</div>
          </div>
        </div>

        <button class="btn-copy" id="copyBtn" onclick="copyReport()">📋 Copiar Reporte Clínico</button>
      </div>
    </div>
  </div>

  <script>
    let currentSystem = 'si';
    let currentSex = 'm';

    const edadInput = document.getElementById('edadInput');
    const edadSlider = document.getElementById('edadSlider');
    const pesoInput = document.getElementById('pesoInput');
    const pesoSlider = document.getElementById('pesoSlider');
    const tallaInput = document.getElementById('tallaInput');
    const tallaSlider = document.getElementById('tallaSlider');
    const ftSlider = document.getElementById('ftSlider');
    const inSlider = document.getElementById('inSlider');

    function setSystem(sys) {
      if (currentSystem === sys) return;
      currentSystem = sys;
      document.getElementById('btnSI').classList.toggle('active', sys === 'si');
      document.getElementById('btnImp').classList.toggle('active', sys === 'imp');

      const isImp = sys === 'imp';
      document.getElementById('metricBox').style.display = isImp ? 'none' : 'block';
      document.getElementById('imperialBox').style.display = isImp ? 'block' : 'none';
      document.getElementById('pesoUnit').innerText = isImp ? 'lb' : 'kg';

      let currentWeight = parseFloat(pesoInput.value);
      if (isImp) {
        let lbs = Math.round(currentWeight * 2.20462);
        pesoSlider.min = 66; pesoSlider.max = 485;
        pesoSlider.value = lbs; pesoInput.value = lbs;
        let cm = parseFloat(tallaInput.value);
        let totalIn = cm / 2.54;
        let ft = Math.floor(totalIn / 12);
        let inch = Math.round(totalIn % 12);
        if (inch === 12) { ft++; inch = 0; }
        ftSlider.value = ft; inSlider.value = inch;
      } else {
        let kg = Math.round(currentWeight / 2.20462);
        pesoSlider.min = 30; pesoSlider.max = 220;
        pesoSlider.value = kg; pesoInput.value = kg;
        let totalIn = (parseInt(ftSlider.value) * 12) + parseInt(inSlider.value);
        let cm = Math.round(totalIn * 2.54);
        tallaSlider.value = cm; tallaInput.value = cm;
      }
      calculate();
    }

    function setSex(sex) {
      currentSex = sex;
      document.getElementById('btnM').classList.toggle('active', sex === 'm');
      document.getElementById('btnF').classList.toggle('active', sex === 'f');
      calculate();
    }

    function calculate() {
      let weightKg, heightCm;
      let age = parseInt(edadInput.value) || 20;

      if (currentSystem === 'si') {
        weightKg = parseFloat(pesoInput.value) || 0;
        heightCm = parseFloat(tallaInput.value) || 0;
      } else {
        let weightLb = parseFloat(pesoInput.value) || 0;
        weightKg = weightLb / 2.20462;
        let ft = parseInt(ftSlider.value);
        let inch = parseInt(inSlider.value);
        document.getElementById('ftVal').innerText = ft;
        document.getElementById('inVal').innerText = inch;
        let totalInches = (ft * 12) + inch;
        document.getElementById('ftInDisplay').innerText = `${ft}' ${inch}" (${totalInches} in)`;
        heightCm = totalInches * 2.54;
      }

      if (heightCm <= 0 || weightKg <= 0) return;

      const heightM = heightCm / 100;
      const imc = weightKg / (heightM * heightM);
      document.getElementById('imcDisplay').innerText = imc.toFixed(1);

      const bsa = Math.sqrt((heightCm * weightKg) / 3600);
      document.getElementById('bsaDisplay').innerText = bsa.toFixed(2) + " m²";

      // Fórmula Mifflin-St Jeor (TMB)
      let tmb = (10 * weightKg) + (6.25 * heightCm) - (5 * age) + (currentSex === 'm' ? 5 : -161);
      document.getElementById('tmbDisplay').innerText = Math.round(tmb) + " kcal/día";

      const heightInches = heightCm / 2.54;
      const inchesOver60 = Math.max(0, heightInches - 60);
      let devineKg = (currentSex === 'm') ? 50 + (2.3 * inchesOver60) : 45.5 + (2.3 * inchesOver60);

      const minHealthyKg = 18.5 * (heightM * heightM);
      const maxHealthyKg = 24.9 * (heightM * heightM);

      if (currentSystem === 'si') {
        document.getElementById('devineDisplay').innerText = devineKg.toFixed(1) + " kg";
      } else {
        document.getElementById('devineDisplay').innerText = (devineKg * 2.20462).toFixed(1) + " lb";
      }

      const deltaEl = document.getElementById('deltaDisplay');
      if (weightKg < minHealthyKg) {
        let diff = minHealthyKg - weightKg;
        deltaEl.innerText = currentSystem === 'si' ? `-${diff.toFixed(1)} kg` : `-${(diff * 2.20462).toFixed(1)} lb`;
        deltaEl.style.color = "#38bdf8";
      } else if (weightKg > maxHealthyKg) {
        let diff = weightKg - maxHealthyKg;
        deltaEl.innerText = currentSystem === 'si' ? `+${diff.toFixed(1)} kg` : `+${(diff * 2.20462).toFixed(1)} lb`;
        deltaEl.style.color = "#f97316";
      } else {
        deltaEl.innerText = "Óptimo";
        deltaEl.style.color = "#4ade80";
      }

      updateUI(imc);
    }

    function updateUI(imc) {
      const classEl = document.getElementById('classDisplay');
      const indicator = document.getElementById('indicator');

      let pct = ((imc - 15) / (42 - 15)) * 100;
      indicator.style.left = `${Math.min(Math.max(pct, 2), 98)}%`;

      if (imc < 18.5) { classEl.innerText = "Bajo peso"; classEl.style.color = "#38bdf8"; }
      else if (imc < 25) { classEl.innerText = "Normopeso"; classEl.style.color = "#22c55e"; }
      else if (imc < 30) { classEl.innerText = "Sobrepeso"; classEl.style.color = "#eab308"; }
      else if (imc < 35) { classEl.innerText = "Obesidad Grado I"; classEl.style.color = "#f97316"; }
      else if (imc < 40) { classEl.innerText = "Obesidad Grado II"; classEl.style.color = "#ef4444"; }
      else { classEl.innerText = "Obesidad Grado III"; classEl.style.color = "#991b1b"; }
    }

    function copyReport() {
      const imc = document.getElementById('imcDisplay').innerText;
      const clas = document.getElementById('classDisplay').innerText;
      const tmb = document.getElementById('tmbDisplay').innerText;
      const bsa = document.getElementById('bsaDisplay').innerText;
      const text = `📊 Reporte Antropométrico:\n• IMC: ${imc} kg/m² (${clas})\n• Gasto Basal: ${tmb}\n• Sup. Corporal: ${bsa}`;
      navigator.clipboard.writeText(text);
      const btn = document.getElementById('copyBtn');
      btn.innerText = "✅ ¡Reporte Copiado!";
      setTimeout(() => { btn.innerText = "📋 Copiar Reporte Clínico"; }, 2000);
    }

    edadSlider.addEventListener('input', (e) => { edadInput.value = e.target.value; calculate(); });
    edadInput.addEventListener('input', (e) => { edadSlider.value = e.target.value; calculate(); });
    pesoSlider.addEventListener('input', (e) => { pesoInput.value = e.target.value; calculate(); });
    pesoInput.addEventListener('input', (e) => { pesoSlider.value = e.target.value; calculate(); });
    tallaSlider.addEventListener('input', (e) => { tallaInput.value = e.target.value; calculate(); });
    tallaInput.addEventListener('input', (e) => { tallaSlider.value = e.target.value; calculate(); });
    ftSlider.addEventListener('input', calculate);
    inSlider.addEventListener('input', calculate);

    calculate();
  </script>
</body>
</html>
